[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "coldrun"
version = "0.1.0"
description = "Fetch, vet and sandbox any downloaded script in one command"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KARAN RJ" }]
requires-python = ">=3.10"
keywords = ["sandbox", "bubblewrap", "security", "scripts", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/rj-karan/coldrun"
Repository = "https://github.com/rj-karan/coldrun"
Issues = "https://github.com/rj-karan/coldrun/issues"
Changelog = "https://github.com/rj-karan/coldrun/blob/main/CHANGELOG.md"

[project.scripts]
coldrun = "coldrun.cli:app"

# Third-party runners register here; see docs/writing-a-runner.md (M5).
[project.entry-points."coldrun.runners"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coldrun"]

[tool.hatch.build.targets.sdist]
include = ["src/coldrun", "tests", "rules", "LICENSE", "README.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "sandbox: needs bubblewrap or podman; proves the sandbox holds",
  "e2e: full coldrun run on a fixture; installs dependencies",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["coldrun"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", "tests/fixtures"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade
  "B",         # bugbear
  "S",         # bandit: flags shell=True, eval, tempfile misuse
  "N",         # naming
  "D",         # docstrings on public objects
  "ANN",       # type annotations everywhere
  "C4",        # comprehensions
  "SIM",       # simplify
  "PTH",       # pathlib over os.path
  "RUF",       # ruff-specific
  "T20",       # no stray print
  "ISC",       # implicit string concatenation
  "PIE",
  "RET",
  "ARG",       # unused arguments
  "TC",        # type-checking imports
  "PGH",       # blanket noqa / type: ignore
  "PERF",
  "FURB",
  "LOG", "G",  # logging
  "ERA",       # commented-out code
  "PL",        # pylint subset
]
ignore = [
  "D105",    # magic methods need no docstring
  "D107",    # __init__ documented on the class
  "D203",    # conflicts with D211
  "D213",    # conflicts with D212
  "PLR0913", # argument counts are reviewed, not counted
  "ISC001",  # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",   # assert is the test idiom
  "D",      # test names are the documentation
  "ANN",    # fixtures and test functions stay light
  "PLR2004",# magic values in assertions are fine
  "ARG",    # fixtures are injected by name
  "TC",     # type-checking blocks add noise in tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["coldrun"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
exclude = ["^tests/fixtures/"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
pretty = true
show_error_codes = true
