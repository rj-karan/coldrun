site_name: coldrun
site_description: Fetch, vet and sandbox any downloaded script in one command.
site_url: https://zororj.me/coldrun/
repo_url: https://github.com/rj-karan/coldrun
repo_name: rj-karan/coldrun
edit_uri: edit/main/docs/
copyright: MIT licence, KARAN RJ

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - content.code.copy
    - navigation.sections
    - search.highlight

nav:
  - Overview: index.md
  - Usage: usage.md
  - Threat model: threat-model.md
  - Runners: runners.md
  - JSON report: json.md
  - FAQ: faq.md
  - Design spec: SPEC.md

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
