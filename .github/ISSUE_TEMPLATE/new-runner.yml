name: New runner
description: Request or offer support for another script language
labels: ["type:feature"]
body:
  - type: input
    id: language
    attributes:
      label: Language and interpreter
      placeholder: Lua 5.4, run with `lua`
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: How dependencies are declared
      description: Manifest files, inline declarations, and how they could be inferred from the code when no manifest exists
    validations:
      required: true
  - type: textarea
    id: install
    attributes:
      label: How dependencies are installed
      description: The package manager, whether it works offline from a cache, and which registry hosts it needs
    validations:
      required: true
  - type: textarea
    id: samples
    attributes:
      label: Sample scripts
      description: Links to two or three public scripts in this language that muzzle should be able to run
    validations:
      required: true
  - type: dropdown
    id: sandbox
    attributes:
      label: Sandbox backend needed
      options: [bubblewrap is enough, needs a Podman image]
    validations:
      required: true
  - type: checkboxes
    id: offer
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this runner myself
