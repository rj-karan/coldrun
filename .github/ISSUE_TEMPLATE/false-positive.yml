name: False positive or missed detection
description: A vetting rule fired on benign code, or missed something it should catch
labels: ["false-positive", "area:vet"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [False positive (rule fired, code is benign), Missed detection (rule should have fired)]
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID
      description: As printed in the finding, for example `CR-PY-EXEC-B64`. Leave blank for a missed detection.
  - type: textarea
    id: sample
    attributes:
      label: Minimal sample
      description: The smallest harmless snippet that reproduces it. Never paste real malware; describe it instead.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is wrong
      description: What the code really does and why the verdict does not fit
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output of `coldrun scan` on the sample
      render: text
