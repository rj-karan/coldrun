name: Bug report
description: Something does not work as the spec or docs say
labels: ["type:bug"]
body:
  - type: input
    id: version
    attributes:
      label: muzzle version
      description: Output of `muzzle --version`
      placeholder: muzzle 0.1.0
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro and kernel
      description: For example `Arch, 6.12.4-arch1-1` or `Kali 2026.1, 6.11.2-amd64`
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact muzzle command, with the source if it is public
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Full output, including the exit code
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `muzzle doctor`
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This is not a security issue or sandbox escape (those go through a private security advisory)
          required: true
