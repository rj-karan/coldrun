version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, type:chore]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [github-actions, type:chore]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
