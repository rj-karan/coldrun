name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 6 * * 1"

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Export locked requirements (runtime and dev)
        run: uv export --no-hashes --no-emit-project -o requirements.txt
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
          summary: true

  secrets:
    name: secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  semgrep:
    name: semgrep (own code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Semgrep on src and tests
        # tests/fixtures holds synthetic samples written to trip rules, so it
        # is excluded here; the vet test suite is where they must match.
        run: >
          uvx --python 3.12 --from semgrep semgrep scan
          --config p/python --config p/bandit --config p/secrets
          --metrics=off --error --exclude tests/fixtures
          src tests
