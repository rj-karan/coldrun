name: PR lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            build
            perf
            style
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject must not start with an uppercase letter.

  linked-issue:
    name: linked issue
    runs-on: ubuntu-latest
    # Dependabot update PRs have no issue by design.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Require a closing keyword in the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -Eiq '\b(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\b[[:space:]]+#[0-9]+'; then
            echo "linked issue found"
          else
            echo "::error::The pull request body must link an issue with a closing keyword, for example 'Closes #12'."
            exit 1
          fi
