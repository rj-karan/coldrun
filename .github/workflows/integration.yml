name: Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  sandbox:
    name: sandbox and e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install bubblewrap and podman
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap podman uidmap slirp4netns fuse-overlayfs nodejs npm golang-go ruby

      - name: Enable unprivileged user namespaces
        # Ubuntu 24.04 runner images ship an AppArmor restriction that stops
        # unprivileged bwrap from creating user namespaces. Lift it, and the
        # older sysctl if present, then prove bwrap works or fail loudly.
        run: |
          set -eu
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            echo "AppArmor userns restriction is on; disabling for this runner"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo 1)" = "0" ]; then
            echo "unprivileged_userns_clone is off; enabling for this runner"
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          echo "user.max_user_namespaces=$(sysctl -n user.max_user_namespaces)"
          if ! bwrap --unshare-all --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev -- /bin/true; then
            echo "::error::bubblewrap cannot create user namespaces on this runner image. The sandbox tests cannot run here; check the runner image notes and the sysctls above."
            exit 1
          fi
          echo "bubblewrap works unprivileged"

      - name: Check rootless podman
        run: |
          podman --version
          podman info --format '{{.Host.Security.Rootless}} {{.Store.GraphDriverName}}'

      - run: uv sync

      - name: Install guarddog and semgrep for the vetting tests
        run: |
          uv tool install guarddog
          uv tool install semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sandbox and end-to-end tests
        run: uv run pytest -m "sandbox or e2e" -v

  arm64:
    # The seccomp filter's aarch64 syscall numbers are only proven on real arm64.
    name: sandbox on arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap

      - name: Enable unprivileged user namespaces
        run: |
          set -eu
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --proc /proc --dev /dev -- /bin/true

      - run: uv sync

      - name: Sandbox escape tests on arm64
        run: uv run pytest -m sandbox -v tests/integration/test_bwrap_backend.py tests/integration/test_bwrap_smoke.py
