name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    outputs:
      has-site: ${{ steps.probe.outputs.has-site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Is the docs site configured yet?
        # The mkdocs site lands in M5 (issue #35). Until then this workflow
        # only reports that there is nothing to publish.
        id: probe
        run: |
          if [ -f mkdocs.yml ]; then
            echo "has-site=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-site=false" >> "$GITHUB_OUTPUT"
            echo "::notice::mkdocs.yml not present; the docs site is tracked in #35"
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.probe.outputs.has-site == 'true'
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group docs
        if: steps.probe.outputs.has-site == 'true'
      - run: uv run mkdocs build --strict
        if: steps.probe.outputs.has-site == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.probe.outputs.has-site == 'true'
        with:
          path: site/

  deploy:
    name: deploy to Pages
    needs: build
    if: needs.build.outputs.has-site == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
